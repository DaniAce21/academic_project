{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <!-- Permite adaptar la página a celulares y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título general del sistema -->
    <title>
        {% block title %}
        Sistema de Gestión Académica
        {% endblock %}
    </title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio del proyecto -->
    <link
        rel="stylesheet"
        href="{% static 'academic/css/styles.css' %}"
    >

</head>


<body>

    <!-- ======================================================
         BARRA DE NAVEGACIÓN
         ====================================================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Nombre del sistema -->
            <a
                class="navbar-brand"
                href="{% url 'home' %}"
            >
                Gestión Académica
            </a>


            <!-- Botón para dispositivos pequeños -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Mostrar navegación"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Menú principal -->
            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >

                <ul class="navbar-nav ms-auto">

                    <!-- Enlace hacia cursos -->
                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'courses' %}"
                        >
                            Cursos
                        </a>

                    </li>


                    <!-- Enlace hacia estudiantes -->
                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'students' %}"
                        >
                            Estudiantes
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ======================================================
         CONTENIDO DE CADA PÁGINA
         ====================================================== -->

    <main class="container py-4">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JavaScript específico de cada página -->
    {% block extra_js %}
    {% endblock %}

</body>

</html>
